log_format my_format '$remote_addr - $remote_user [$time_local] '
                     '"$request" (raw_uri:$request_uri → rewritten:$uri → upstream:$upstream_addr) '
                     '$status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'request_body: $request_body ';

server {
    listen 5566;
    listen [::]:5566;
    server_name localhost;

    location = / {
        return 302 /taichung_urban_renewal/;
    }

    # 台中都市更新前端
    location ^~ /taichung_urban_renewal/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ @taichung_urban_renewal_fallback;
    }

    # 靜態資源（避免被 regex location 吃到錯誤路徑）
    location ^~ /taichung_urban_renewal/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /taichung_urban_renewal/vite.svg {
        alias /usr/share/nginx/html/vite.svg;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @taichung_urban_renewal_fallback {
        rewrite ^ /taichung_urban_renewal/index.html last;
    }

    location = /taichung_urban_renewal/index.html {
        alias /usr/share/nginx/html/index.html;
        internal;
    }

    # 靜態資源快取
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    client_max_body_size 20m;
}
